name: glance
description: demo viewer for code & CAD, backed by a Rust core via flutter_rust_bridge.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  file_picker: ^8.0.0
  saf: ^2.1.0
  path: ^1.9.0
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
